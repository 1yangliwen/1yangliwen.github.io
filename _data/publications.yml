      url: "https://openaccess.thecvf.com/content/CVPR2026/papers/Liu_From_Pairs_to_Sequences_Track-Aware_Policy_Gradients_for_Keypoint_Detection_CVPR_2026_paper.pdf"
    - name: Code
      url: "https://github.com/xiaomi-research/traqpoint"

- title: "Large Model Based Crossmodal Chinese Poetry Creation"
  authors: "<b>Liwen Yang</b>, Zhidong Zhang, Kaipeng Niu, Sitian Pan, Weiping Zhu, Chao Ma"
  venue: "IEEE Smart World Congress"
  venue_short: "SWC 2024"
  year: 2024
  image: "/assets/img/swc2024_poetry_architecture.png"
  tldr: >
    Proposed a large-model-based system for cross-modal (text and image)
    Chinese poetry creation with interpretable annotations and iterative
    optimization.
  abstract: >
    Generating Chinese poetry is a complex task with significant potential
    for large models. However, most current systems only support
    single-modal input and the output lacks interpretability. This paper
    proposes a large model based system that supports cross-modal input of
    text and image, provides interpretable annotations for generated
    Chinese poems, and supports multiple rounds of iterative optimization.

    First, it analyzes images with CLIP and MiniGPT-4 and generates
    descriptive text from the analysis with ERNIE-4.0. Then, it generates
    Chinese ancient poems from the input text and descriptive text by
    ERNIE-4.0, using our devised prompts based on CRISPE. Finally, it
    evaluates and then optimizes the created poems with prompts based on
    few-shot learning.

    Preliminary evaluations have validated the efficacy of our poetry
    scoring criteria and demonstrated the superior performance of the
    system when utilizing the conjunction of text and imagery as
    cross-modal inputs.
  links:
    - name: Paper
      url: "https://ieeexplore.ieee.org/document/10925057/"
